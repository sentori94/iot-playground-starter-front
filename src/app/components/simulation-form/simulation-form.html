<div class="simulation-container">
  <div class="form-card">
    <div class="form-header">
      <h1>🚀 Simulation IoT</h1>
      <p class="subtitle">Lancez vos simulations sur vos devices IoT</p>
    </div>

    <form class="simulation-form" (submit)="onSubmit($event)">

      <!-- Accordion Section 1 - Toujours ouverte -->
      <div class="accordion-section active">
        <div class="accordion-header" (click)="toggleSection(1)">
          <div class="accordion-title">
            <span class="section-icon">📋</span>
            <span>Configuration Générale</span>
          </div>
          <span class="accordion-arrow">{{openSections[1] ? '▼' : '▶'}}</span>
        </div>
        <div class="accordion-content" [class.collapsed]="!openSections[1]">
          <div class="form-group">
            <label for="username">Utilisateur</label>
            <input
              type="text"
              id="username"
              name="username"
              placeholder="Ex: john_doe"
              class="form-input"
              required
              minlength="3"
              maxlength="20"
              pattern="[A-Za-z0-9._-]{3,20}"
              title="3–20 caractères: lettres, chiffres, . _ -"
            />
          </div>
          <div class="form-group">
            <label for="sensorsCount">Nombre de capteurs (1–100)</label>
            <input
              type="number"
              id="sensorsCount"
              name="sensorsCount"
              placeholder="Nombre de capteurs"
              class="form-input"
              min="1"
              max="100"
              value="1"
              required
            />
          </div>
          <div class="form-group">
            <label for="count">Count (1–1000)</label>
            <input
              type="number"
              id="count"
              name="count"
              placeholder="Nombre d'envois"
              class="form-input"
              min="1"
              max="1000"
              value="10"
              required
            />
          </div>
          <div class="form-group">
            <label for="intervalMs">Interval (200–10000 ms)</label>
            <input
              type="number"
              id="intervalMs"
              name="intervalMs"
              placeholder="Intervalle en millisecondes"
              class="form-input"
              min="200"
              max="10000"
              value="200"
              required
            />
          </div>
        </div>
      </div>

      <!-- Accordion Section 2 -->
      <div class="accordion-section" [class.active]="openSections[2]">
        <div class="accordion-header" (click)="toggleSection(2)">
          <div class="accordion-title">
            <span class="section-icon">⚙️</span>
            <span>Paramètres de Simulation</span>
          </div>
          <span class="accordion-arrow">{{openSections[2] ? '▼' : '▶'}}</span>
        </div>
        <div class="accordion-content" [class.collapsed]="!openSections[2]">
          <div class="form-group">
            <label for="input3">Input 3</label>
            <input
              type="text"
              id="input3"
              placeholder="Entrez la valeur 3"
              class="form-input"
            />
          </div>
          <div class="form-group">
            <label for="input4">Input 4</label>
            <input
              type="number"
              id="input4"
              placeholder="Entrez la valeur 4"
              class="form-input"
            />
          </div>
        </div>
      </div>

      <!-- Accordion Section 3 -->
      <div class="accordion-section" [class.active]="openSections[3]">
        <div class="accordion-header" (click)="toggleSection(3)">
          <div class="accordion-title">
            <span class="section-icon">🎯</span>
            <span>Options Avancées</span>
          </div>
          <span class="accordion-arrow">{{openSections[3] ? '▼' : '▶'}}</span>
        </div>
        <div class="accordion-content" [class.collapsed]="!openSections[3]">
          <div class="form-group">
            <label for="input5">Input 5</label>
            <select id="input5" class="form-input">
              <option value="">Sélectionnez une option</option>
              <option value="option1">Option 1</option>
              <option value="option2">Option 2</option>
              <option value="option3">Option 3</option>
            </select>
          </div>
          <div class="form-group">
            <label for="input6">Input 6</label>
            <input
              type="text"
              id="input6"
              placeholder="Entrez la valeur 6"
              class="form-input"
            />
          </div>
        </div>
      </div>

      <button type="submit" class="btn-primary">
        <span class="btn-icon">▶</span>
        Lancer la Simulation
      </button>
    </form>
  </div>
</div>
