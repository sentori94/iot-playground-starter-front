name: Deploy to S3 + CloudFront

on:
  workflow_dispatch:  # Déclenchement manuel
  push:
    branches:
      - master  # Déploiement auto sur push master

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: 'npm'

      - name: Install dependencies & Build
        run: |
          npm ci
          npm run build:prod

      - name: List build output
        run: |
          echo "📂 Contenu de dist/:"
          ls -la dist/ || echo "dist/ n'existe pas"
          echo ""
          echo "📂 Contenu de dist/iot-playground/:"
          ls -la dist/iot-playground/ || echo "dist/iot-playground/ n'existe pas"
          echo ""
          echo "📂 Contenu de dist/iot-playground/browser/:"
          ls -la dist/iot-playground/browser/ || echo "dist/iot-playground/browser/ n'existe pas"
          echo ""
          echo "📂 Contenu de dist/iot-playground/browser/browser/:"
          ls -la dist/iot-playground/browser/browser/ || echo "dist/iot-playground/browser/browser/ n'existe pas"

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ vars.AWS_REGION }}

      - name: Deploy to S3
        run: |
          # Upload tous les fichiers sauf index.html avec cache long
          aws s3 sync dist/iot-playground/browser/browser/ s3://${{ vars.S3_BUCKET_NAME }}/ \
            --delete \
            --exclude "index.html" \
            --cache-control "public,max-age=31536000,immutable"
          
          # Upload index.html sans cache pour forcer le refresh
          aws s3 cp dist/iot-playground/browser/browser/index.html s3://${{ vars.S3_BUCKET_NAME }}/index.html \
            --cache-control "no-cache,no-store,must-revalidate" \
            --content-type "text/html"

      - name: Invalidate CloudFront
        run: |
          aws cloudfront create-invalidation \
            --distribution-id ${{ vars.CLOUDFRONT_DISTRIBUTION_ID }} \
            --paths "/*"
          echo "✅ CloudFront cache invalidated"
